version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: repoflow-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: repoflow
      POSTGRES_PASSWORD: repoflow_dev
      POSTGRES_DB: repoflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repoflow']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
